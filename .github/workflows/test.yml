name: PORTEFOLIO CI

on: 
  push:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/Checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
           node-version: 22
           cache: "pnpm"
      - run: pnpm install
      - run: pnpm run lint 
      - run: pnpm run build

